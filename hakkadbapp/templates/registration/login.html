{% extends "hakkadbapp/base.html" %}
{% block content %}
<div class="mt-6 sm:mt-10 px-4 w-full max-w-sm mx-auto">
  <form method="post" action="{% url 'login' %}"
        class="bg-white rounded-xl border border-gray-200 shadow-sm p-5 space-y-4">
    {% csrf_token %}
    <h2 class="font-display text-xl font-bold text-gray-800">Connexion</h2>
    <p class="text-sm text-gray-600">Réservé aux personnes qui saisissent le lexique.</p>

    {% if form.errors %}
      <p class="text-sm text-red-700 bg-red-50 border border-red-200 rounded-md p-2">
        Identifiant ou mot de passe incorrect.
      </p>
    {% endif %}

    <div>
      <label for="id_username" class="block text-sm font-semibold text-gray-700 mb-1">Identifiant</label>
      <input type="text" name="username" id="id_username" required autofocus
             autocapitalize="off" autocorrect="off" autocomplete="username"
             value="{{ form.username.value|default:'' }}"
             class="w-full min-h-11 px-3 py-2 border border-gray-300 rounded-md text-base focus:outline-none focus:ring-2 focus:ring-brand-gold">
    </div>
    <div>
      <label for="id_password" class="block text-sm font-semibold text-gray-700 mb-1">Mot de passe</label>
      <input type="password" name="password" id="id_password" required autocomplete="current-password"
             class="w-full min-h-11 px-3 py-2 border border-gray-300 rounded-md text-base focus:outline-none focus:ring-2 focus:ring-brand-gold">
    </div>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit"
            class="w-full min-h-11 px-4 py-2 rounded-md shadow-sm bg-brand text-white font-semibold hover:bg-brand-dark focus:outline-none focus:ring-2 focus:ring-brand-gold touch-manipulation">
      Se connecter
    </button>
  </form>
</div>
{% endblock %}
