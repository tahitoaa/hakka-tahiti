{% comment %}
  Two of the reading settings, shared by the converter and the transcriber:
  the system syllables are typed in, and the system pinyin is shown in (the
  same setting as the header menu, kept in sync by Romanization.js). Each is
  a <label class="rom-setting"> so a page can lay them out as rows.
{% endcomment %}
<label class="rom-setting">
  <span class="rom-setting-label">Je tape en</span>
  <select id="romanization-input-menu" class="rom-setting-select">
    {% for s in romanization_systems %}
    <option value="{{ s.id }}" title="{{ s.source }}"{% if s.id == romanization_default %} selected{% endif %}>{{ s.label }}</option>
    {% endfor %}
    <option value="auto">comme l'affichage</option>
  </select>
</label>
<label class="rom-setting">
  <span class="rom-setting-label">J'affiche en</span>
  <select class="romanization-display-menu rom-setting-select">
    {% for s in romanization_systems %}
    <option value="{{ s.id }}" title="{{ s.source }}"{% if s.id == romanization_default %} selected{% endif %}>{{ s.label }}</option>
    {% endfor %}
  </select>
</label>
<style>
  .rom-setting { display: inline-flex; align-items: center; gap: 0.5rem; font-size: 0.875rem; color: #544D45; }
  .rom-setting-label { white-space: nowrap; color: #8C8478; }
  .rom-setting-select {
    min-height: 2.25rem; padding: 0.25rem 0.5rem; font-size: 0.875rem; background: #fff;
    border: 1px solid #DDD0BD; border-radius: 0.375rem; max-width: 100%;
  }
  .rom-setting-select:focus { outline: 2px solid var(--color-brand-gold, #FFBE3B); outline-offset: 1px; }
</style>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    Romanization.bindInputMenu(document.getElementById('romanization-input-menu'));
    document.querySelectorAll('.romanization-display-menu').forEach(function (menu) {
      Romanization.bindMenu(menu);
    });
  });
</script>
