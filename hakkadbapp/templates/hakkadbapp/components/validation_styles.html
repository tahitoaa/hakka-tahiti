{# Styles of the Validation table, also used by the import page (vt-*, vs-*). #}
<style>
  /* A table made for an iPad in landscape: big tick boxes, rows that tick
     when tapped, the bulk buttons always in reach (sticky). */
  .vt-bar { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem;
            padding: 0.6rem 0.75rem; background: #fff; border: 1px solid #DDD0BD; border-radius: 0.75rem;
            box-shadow: 0 2px 6px rgb(0 0 0 / .06); }
  .vt-bar .vt-count { font-weight: 600; color: #544D45; margin-right: auto; min-width: 9rem; }
  /* The slideshow's keys, on a computer only. */
  .vs-keys { margin: 0.4rem 0 0; text-align: center; font-size: 0.75rem; color: #6E665C; }
  .vs-keys kbd { display: inline-block; min-width: 1.4em; padding: 0 0.3em; border: 1px solid #DDD0BD; border-bottom-width: 2px;
                 border-radius: 0.3rem; background: #FDFAF5; font: 600 0.7rem/1.5 ui-monospace, monospace; }
  @media (hover: none), (max-width: 640px) { .vs-keys { display: none; } }
  /* A draft's hakka edited from its Saisie text (ValidationTable.editText). */
  .vt-text-edit { display: grid; gap: 0.2rem; min-width: min(20rem, 80vw); text-align: left; }
  .vt-text-edit input { width: 100%; }
  .vt-text-out { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.2rem 0.6rem; font-size: 0.85rem; color: #3A3430; }
  .vt-text-out .hanzi { font-size: 1.15rem; }
  .vt-text-problem { flex-basis: 100%; color: #9B1C1C; font-size: 0.78rem; }
  td.is-editing-text { position: relative; z-index: 2; background: #FFFDF7; }
  /* « Lectures à vérifier »: the readings to settle, one by one. */
  .vt-pinyin-panel { background: #fff; border: 1px solid #ECE2D3; border-left: 4px solid #c9a227; border-radius: 0.75rem; padding: 0.6rem 0.8rem; }
  .vt-pinyin-panel[hidden] { display: none; }
  .vp-head { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }
  .vp-head > b { font-size: 1rem; color: #261F1C; }
  .vp-n { padding: 0 0.5rem; border-radius: 9999px; background: #F6EFE4; font-weight: 700; font-size: 0.8rem; }
  .vp-close { margin-left: auto; width: 2rem; height: 2rem; border-radius: 9999px; color: #6E665C; }
  .vp-close:hover { background: #F6EFE4; }
  .vp-sub { font-size: 0.8rem; color: #6E665C; margin: 0.2rem 0 0.4rem; }
  .vp-list { display: grid; gap: 0.4rem; max-height: 60vh; overflow-y: auto; }
  .vp-item { display: grid; gap: 0.2rem 0.8rem; padding: 0.45rem 0.6rem; border: 1px solid #F0E8DC; border-radius: 0.6rem; background: #FDFAF5; }
  @media (min-width: 900px) { .vp-item { grid-template-columns: minmax(10rem, auto) 1fr auto; align-items: center; } }
  .vp-reading { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.4rem; }
  .vp-reading .hanzi { font-size: 1.3rem; color: #261F1C; }
  .vp-reading del { color: #9B1C1C; } .vp-reading ins { color: #065f46; text-decoration: none; font-weight: 700; }
  .vp-problems { font-size: 0.8rem; color: #7c2d12; list-style: disc; padding-left: 1rem; }
  .vp-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 0.35rem; }
  .vp-actions input { width: 9rem; min-height: 2.1rem; padding: 0 0.5rem; border: 1px solid #DDD0BD; border-radius: 0.4rem; background: #fff; }
  /* « Vérifier le pinyin »: what was corrected, what is left to look at. */
  .vt-pinyin-report { margin: 0.2rem 0 0.4rem; padding-left: 1.1rem; list-style: disc; display: grid; gap: 0.1rem; color: #3A3430; }
  .vt-pinyin-report .hanzi { font-size: 1.05rem; }
  .vt-pinyin-report.is-left { color: #9B1C1C; }
  /* The journey: Brouillons → À valider → Validés (Rejetés aside), in the status colours. */
  .st-steps { display: flex; flex-wrap: wrap; align-items: stretch; gap: 0.35rem; }
  .st-step { display: inline-flex; align-items: center; gap: 0.45rem; min-height: 3rem; padding: 0.35rem 0.85rem 0.35rem 0.4rem;
             border-radius: 9999px; border: 2px solid #E8DFD2; background: #fff; color: #544D45; font-weight: 700; }
  .st-dot { display: inline-grid; place-items: center; width: 2.1rem; height: 2.1rem; border-radius: 9999px; background: #F0EBE3; font-size: 1rem; }
  .st-n { min-width: 1.6rem; padding: 0 0.4rem; border-radius: 9999px; background: #F0EBE3; font-size: 0.8rem; text-align: center; font-variant-numeric: tabular-nums; }
  .st-arrow { align-self: center; color: #B5AA9B; font-size: 1.2rem; font-weight: 700; }
  .st-side { margin-left: auto; min-height: 2.4rem; font-size: 0.85rem; opacity: 0.85; }
  .st-side .st-dot { width: 1.7rem; height: 1.7rem; }
  .st-draft .st-dot { background: #F0EBE3; } .st-review .st-dot { background: #fef3c7; color: #92400e; }
  .st-validated .st-dot { background: #d1fae5; color: #065f46; } .st-rejected .st-dot { background: #fee2e2; color: #991b1b; }
  .st-step[aria-pressed="true"].st-draft { border-color: #8C8478; background: #F0EBE3; }
  .st-step[aria-pressed="true"].st-review { border-color: #f59e0b; background: #fef3c7; color: #92400e; }
  .st-step[aria-pressed="true"].st-validated { border-color: #10b981; background: #d1fae5; color: #065f46; }
  .st-step[aria-pressed="true"].st-rejected { border-color: #ef4444; background: #fee2e2; color: #991b1b; }
  .st-step[aria-pressed="true"] .st-n { background: #fff; }
  /* After « Validés »: the entries are in the lexicon; what is left is done on e-reo. */
  .st-ereo { border-style: dashed; }
  .st-ereo .st-dot { background: #ede9fe; color: #5b21b6; }
  .st-step[aria-pressed="true"].st-ereo { border-style: solid; border-color: #8b5cf6; background: #ede9fe; color: #5b21b6; }
  /* « Caractères »: the readings of the additions' characters (char_review.js). */
  .st-side + .st-side { margin-left: 0; }
  .st-chars .st-dot { background: #ffedd5; color: #9a3412; font-family: serif; }
  .st-step[aria-pressed="true"].st-chars { border-color: #f97316; background: #ffedd5; color: #9a3412; }
  @media (max-width: 640px) {
    .st-steps { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr auto 1fr; gap: 0.15rem; }
    .st-steps .st-arrow { font-size: 0.85rem; }
    .st-step { flex-direction: column; gap: 0.1rem; min-height: 4rem; padding: 0.3rem 0.2rem; border-radius: 0.8rem; font-size: 0.75rem; justify-content: center; }
    .st-side { grid-column: 1 / -1; flex-direction: row; min-height: 2.2rem; margin-left: 0; justify-self: end; }
    .st-side.st-chars { grid-column: 1 / 4; justify-self: start; }
    .st-side.st-rejected { grid-column: 5 / -1; }
  }
  /* New characters / new readings, in the tables and the « Caractères » step. */
  .cr-new-char { background: #fee2e2; color: #991b1b; border-radius: 0.2rem; box-shadow: inset 0 -2px #ef4444; }
  .cr-new-reading { background: #ffedd5; color: #9a3412; border-radius: 0.2rem; box-shadow: inset 0 -2px #f97316; }
  .cr-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }
  .cr-statuses { display: flex; flex-wrap: wrap; gap: 0.6rem; font-size: 0.85rem; color: #544D45; }
  .cr-statuses label { display: inline-flex; align-items: center; gap: 0.25rem; }
  .cr-legend { font-size: 0.8rem; color: #6E655C; }
  .cr-legend .hanzi, .cr-legend span[class^="cr-new"] { padding: 0 0.15rem; }
  .cr-list { display: grid; gap: 0.6rem; }
  .cr-card { background: #fff; border: 1px solid #E8D9C2; border-radius: 0.75rem; padding: 0.6rem 0.75rem; display: grid; gap: 0.5rem; }
  .cr-card.is-seen { opacity: 0.7; }
  .cr-head { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem 0.75rem; }
  .cr-big { font-size: 2.2rem !important; line-height: 1; color: #3A3430; }
  .cr-uh { font-size: 0.8rem; color: #6E655C; flex: 1 1 12rem; }
  .cr-uh b { color: #3730a3; font-weight: 600; }
  .cr-badges { display: flex; flex-wrap: wrap; gap: 0.25rem; }
  .cr-badge { font-size: 0.72rem; font-weight: 700; padding: 0.1rem 0.5rem; border-radius: 9999px; background: #F0EBE3; color: #544D45; }
  .cr-badge.is-new-char { background: #fee2e2; color: #991b1b; }
  .cr-badge.is-new-reading { background: #ffedd5; color: #9a3412; }
  .cr-badge.is-mixed { background: #fef3c7; color: #92400e; }
  .cr-seen { margin-left: auto; }
  .cr-compare { display: grid; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); gap: 0.4rem 1rem; padding: 0.4rem 0.5rem;
                background: #FDFAF5; border-radius: 0.5rem; font-size: 0.85rem; }
  .cr-label { display: inline-block; min-width: 6.5rem; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: #8C8478; }
  .cr-chip { display: inline-flex; align-items: baseline; gap: 0.25rem; margin: 0.1rem 0.25rem 0.1rem 0; padding: 0.05rem 0.5rem; border-radius: 9999px;
             background: #F0EBE3; color: #3A3430; font-weight: 700; }
  .cr-chip small { font-weight: 500; color: #8C8478; font-size: 0.72rem; }
  .cr-chip.cr-dict { background: #eef2ff; color: #3730a3; }
  .cr-chip.cr-dict.is-doubt { background: #FFF7ED; color: #9a3412; }
  .cr-chip.is-new-reading { background: #ffedd5; color: #9a3412; }
  .cr-chip.is-new-char { background: #fee2e2; color: #991b1b; }
  .cr-none { color: #991b1b; font-style: italic; }
  .cr-examples { margin: 0.2rem 0 0 0.2rem; font-size: 0.78rem; color: #6E655C; }
  .cr-group { border-left: 3px solid #E8D9C2; padding-left: 0.6rem; }
  .cr-group.is-new-reading { border-left-color: #f97316; }
  .cr-group.is-new-char { border-left-color: #ef4444; }
  .cr-group.is-loose { border-left-color: #B5AA9B; border-left-style: dashed; }
  .cr-group-head { display: flex; flex-wrap: wrap; align-items: center; gap: 0.3rem 0.6rem; }
  .cr-what { font-size: 0.8rem; color: #6E655C; }
  .cr-replaces { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 0.25rem; font-size: 0.8rem; color: #6E655C; }
  .cr-replace { padding: 0.1rem 0.55rem; border: 1px solid #DDD0BD; border-radius: 9999px; background: #fff; font-weight: 700; color: #9B1C1C; }
  .cr-replace:hover { background: #F3E8D6; }
  .cr-add { display: flex; flex-wrap: wrap; align-items: center; gap: 0.2rem 0.6rem; padding: 0.2rem 0; font-size: 0.9rem; border-bottom: 1px dashed #F0EBE3; }
  .cr-add:last-child { border-bottom: 0; }
  .cr-add-hz { font-size: 1.15rem !important; }
  .cr-add-py { color: #544D45; }
  .cr-add-fr { color: #3A3430; flex: 1 1 10rem; }
  .cr-syl { background: #fde68a; color: inherit; border-radius: 0.2rem; padding: 0 0.1rem; }
  .cr-edit { min-height: 1.9rem; padding: 0 0.55rem; }
  .cr-unfold { margin: 0.2rem 0 0.1rem; padding: 0.15rem 0.7rem; border: 1px dashed #DDD0BD; border-radius: 9999px; background: #FDFAF5;
               font-size: 0.8rem; font-weight: 600; color: #6E655C; }
  .cr-unfold:hover { background: #F3E8D6; }
  .cr-badge.is-refused { background: #fee2e2; color: #991b1b; }
  .cr-badge.is-done { background: #d1fae5; color: #065f46; }
  .cr-group.is-accepted { border-left-color: #10b981; }
  .cr-group.is-refused { border-left-color: #dc2626; border-left-width: 4px; }
  .cr-decision { font-size: 0.75rem; font-weight: 700; padding: 0.05rem 0.5rem; border-radius: 9999px; }
  .cr-decision.is-accepted { background: #d1fae5; color: #065f46; }
  .cr-decision.is-refused { background: #fee2e2; color: #991b1b; }
  .cr-decide { padding: 0.1rem 0.55rem; border: 1px solid #DDD0BD; border-radius: 9999px; background: #fff; font-size: 0.8rem; font-weight: 700; }
  .cr-decide.is-accept { color: #065f46; } .cr-decide.is-refuse { color: #991b1b; }
  .cr-decide.is-accept[aria-pressed="true"] { background: #d1fae5; border-color: #10b981; }
  .cr-decide.is-refuse[aria-pressed="true"] { background: #fee2e2; border-color: #ef4444; }
  /* Visas (visas.js): 👍 / 👎 per member, the reader's own pressed. */
  .vz { display: inline-flex; align-items: center; gap: 0.2rem; margin-top: 0.2rem; }
  .vz-btn { display: inline-flex; align-items: center; gap: 0.15rem; min-height: 1.7rem; padding: 0 0.4rem; border: 1px solid #E8D9C2;
            border-radius: 9999px; background: #fff; font-size: 0.8rem; line-height: 1; filter: grayscale(0.6); }
  .vz-btn b { font-size: 0.75rem; color: #3A3430; }
  .vz-btn:hover { filter: none; background: #F3E8D6; }
  .vz-btn.vz-ok[aria-pressed="true"] { filter: none; background: #d1fae5; border-color: #10b981; }
  .vz-btn.vz-ko[aria-pressed="true"] { filter: none; background: #fee2e2; border-color: #ef4444; }
  .vz-notes { font-size: 0.75rem; color: #6E655C; cursor: help; }
  /* Possible duplicates (addition_duplicates.js). */
  .dup-badge { display: inline-block; margin-top: 0.2rem; padding: 0.05rem 0.5rem; border-radius: 9999px; font-size: 0.72rem; font-weight: 700;
               border: 1px solid transparent; white-space: nowrap; }
  .dup-badge.is-exact { background: #fee2e2; color: #991b1b; border-color: #fca5a5; }
  .dup-badge.is-strong { background: #ffedd5; color: #9a3412; border-color: #fdba74; }
  .dup-badge.is-weak { background: #F0EBE3; color: #544D45; }
  .dup-badge[aria-expanded="true"] { box-shadow: 0 0 0 2px rgb(0 0 0 / .12); }
  .vt-dup-row td { background: #FDFAF5; padding-top: 0.2rem; padding-bottom: 0.5rem; }
  .dup-list { font-size: 0.85rem; text-align: left; }
  .dup-head { font-size: 0.78rem; color: #6E655C; margin-bottom: 0.2rem; }
  .dup-item { display: flex; flex-wrap: wrap; align-items: center; gap: 0.15rem 0.6rem; padding: 0.2rem 0 0.2rem 0.5rem;
              border-left: 3px solid #E8D9C2; margin-bottom: 0.15rem; }
  .dup-item.is-exact { border-left-color: #ef4444; } .dup-item.is-strong { border-left-color: #f97316; }
  .dup-where { font-size: 0.72rem; font-weight: 700; color: #8C8478; min-width: 8.5rem; }
  .dup-f { color: #544D45; }
  .dup-f.is-same { background: #fef08a; color: #3A3430; border-radius: 0.2rem; padding: 0 0.15rem; }
  .dup-item .hanzi { font-size: 1.05rem !important; }
  .dup-open { min-height: 1.7rem; padding: 0 0.5rem; }
  .vs-card .dup-list { margin: 0.4rem auto 0; max-width: 40rem; }
  .cr-notes { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.25rem 1rem; margin: 0.2rem 0; font-size: 0.85rem; color: #544D45; }
  .cr-notes .hanzi { font-size: 1.15rem !important; padding: 0 0.15rem; }
  .vt-ai-count input { width: 3.4rem; min-height: 2rem; padding: 0 0.3rem; border: 1px solid #DDD0BD; border-radius: 0.4rem; text-align: center; }
  .vt-facets { display: flex; flex-wrap: wrap; gap: 0.35rem; align-items: center; font-size: 0.8rem; }
  .vt-facets label { display: inline-flex; align-items: center; gap: 0.25rem; padding: 0 0.15rem 0 0.55rem; min-height: 2rem;
                     border: 1px solid #DDD0BD; border-radius: 9999px; background: #fff; color: #6E655C; }
  .vt-facets label.is-on { border-color: #9B1C1C; background: #FBF0E6; color: #9B1C1C; font-weight: 600; }
  .vt-facets select { border: 0; background: transparent; font: inherit; color: #261F1C; max-width: 11rem; padding: 0.15rem 0.2rem; }
  .vt-facets-reset { color: #9B1C1C; font-weight: 600; padding: 0 0.5rem; min-height: 2rem; }
  .vt-facets-rename { color: #544D45; font-weight: 600; padding: 0 0.6rem; min-height: 2rem; border: 1px solid #DDD0BD; border-radius: 9999px; background: #fff; }
  .vt-group td { background: #F6EFE4; padding-top: 0.3rem; padding-bottom: 0.3rem; font-size: 0.85rem; color: #3A3430; }
  .vt-src { font-size: 0.7rem; color: #6E655C; max-width: 9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vt-more { display: block; margin: 0.5rem auto; }
  .vt-import-source { display: flex; align-items: center; gap: 0.4rem; font-size: 0.85rem; font-weight: 600; color: #544D45; margin: 0.25rem 0; }
  .vt-import-source input { flex: 1 1 14rem; max-width: 24rem; min-height: 2.1rem; padding: 0 0.6rem; border: 1px solid #DDD0BD; border-radius: 0.4rem; font-weight: 400; }
  .vt-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid #E8DFD2; border-radius: 0.75rem; background: #fff; }
  .vt-table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
  .vt-table th { position: sticky; top: 0; background: #F6EFE4; color: #544D45; font-size: 0.75rem; font-weight: 700;
                 text-transform: uppercase; letter-spacing: 0.03em; text-align: left; padding: 0.55rem 0.6rem; white-space: nowrap; }
  .vt-table td { padding: 0.55rem 0.6rem; border-top: 1px solid #F0E8DC; vertical-align: middle; color: #261F1C; }
  .vt-table tbody tr { cursor: pointer; transition: background-color .12s; }
  .vt-table tbody tr:hover { background: #FDFAF5; }
  .vt-table tbody tr.is-selected { background: #FBF0E6; box-shadow: inset 4px 0 0 var(--color-brand, #9B1C1C); }
  .vt-table tr.is-busy td { opacity: 0.55; }
  .vt-check { width: 3.25rem; text-align: center; }
  .vt-check input, #validation-all { width: 1.5rem; height: 1.5rem; accent-color: var(--color-brand, #9B1C1C); cursor: pointer; }
  .vt-hanzi { font-size: 1.4rem; white-space: nowrap; }
  .vt-pinyin { white-space: nowrap; color: #544D45; }
  .vt-french { min-width: 12rem; }
  .vt-meta { font-size: 0.85rem; color: #544D45; white-space: nowrap; }
  .vt-sub { font-size: 0.75rem; color: #8C8478; white-space: normal; }
  .vt-actions { width: 3.5rem; text-align: right; }
  .vt-actions .saisie-btn { min-width: 2.75rem; min-height: 2.75rem; font-size: 1.1rem; }
  .vt-empty { padding: 1.5rem !important; text-align: center; color: #8C8478; cursor: default; }
  .vt-status { display: inline-block; padding: 0.15rem 0.6rem; border-radius: 9999px; font-size: 0.78rem; font-weight: 600; white-space: nowrap; }
  .vt-status-draft { background: #F0EBE3; color: #544D45; }
  .vt-status-review { background: #fef3c7; color: #92400e; }
  .vt-status-validated { background: #d1fae5; color: #065f46; }
  .vt-status-rejected { background: #fee2e2; color: #991b1b; }
  /* Narrower than a landscape iPad: the author column goes. */
  .vt-who { white-space: nowrap; }
  /* iPad held upright: the author stays, the type/theme column goes (it is in the slideshow). */
  @media (max-width: 899px) { .vt-table .vt-type { display: none; } }
  /* Words / expressions: two tabs over the table. */
  .vt-kinds { display: flex; gap: 0.25rem; border-bottom: 2px solid #E8DFD2; margin-bottom: 0.25rem; }
  .vt-kinds button { display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.35rem 0.8rem; font-weight: 700; font-size: 0.85rem;
                     color: #6E655C; border-bottom: 3px solid transparent; margin-bottom: -2px; }
  .vt-kinds button[aria-selected="true"] { color: #9B1C1C; border-bottom-color: #9B1C1C; }
  .vt-kinds-n { min-width: 1.4rem; padding: 0 0.35rem; border-radius: 9999px; background: #F0EBE3; color: #544D45; font-size: 0.72rem; line-height: 1.3rem; text-align: center; }
  .vt-kinds button[aria-selected="true"] .vt-kinds-n { background: #9B1C1C; color: #fff; }
  /* AI assistant: remarks under a row, its badge, the two tabs. */
  .vt-tabs { display: flex; gap: 0.25rem; border-bottom: 2px solid #E8DFD2; }
  .vt-tabs button { min-height: 2.75rem; padding: 0.4rem 1rem; font-weight: 700; color: #6E655C; border-bottom: 3px solid transparent; margin-bottom: -2px; }
  .vt-tabs button[aria-selected="true"] { color: var(--color-brand, #9B1C1C); border-bottom-color: var(--color-brand, #9B1C1C); }
  .vt-ai-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; padding: 0.6rem 0.75rem; border: 1px dashed #c4b5fd;
                 background: #faf7ff; border-radius: 0.75rem; font-size: 0.85rem; color: #4c1d95; }
  .vt-ai-tools[hidden] { display: none; }
  .vt-ai-tools b { margin-right: auto; }
