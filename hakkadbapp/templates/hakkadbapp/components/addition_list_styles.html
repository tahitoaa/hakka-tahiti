{# Styles of the addition list (AdditionList.js), shared by the Saisie and Validation pages. #}
<style>
  /* Status badges, the same colours on every page (Saisie, Validation, IA, Import). */
  /* Incomplete: what must be filled before validating. */
  .vt-incomplete { display: inline-block; margin-left: 0.25rem; padding: 0.02rem 0.45rem; border-radius: 9999px; background: #ffedd5; color: #9a3412;
                   font-size: 0.66rem; font-weight: 700; white-space: nowrap; border: 1px solid #fdba74; }
  .vt-missing-tag { display: inline-block; padding: 0 0.3rem; border-radius: 0.25rem; background: #fff7ed; color: #c2410c; font-size: 0.72rem;
                    border: 1px dashed #fdba74; font-style: normal; }
  .vt-edit.is-missing { background: #fff7ed; border-bottom: 1px dashed #f97316; min-width: 3rem; }
  .vt-status { display: inline-block; padding: 0.05rem 0.5rem; border-radius: 9999px; font-size: 0.72rem; font-weight: 600; white-space: nowrap; }
  .vt-status-draft { background: #F0EBE3; color: #544D45; }
  .vt-status-review { background: #fef3c7; color: #92400e; }
  .vt-status-validated { background: #d1fae5; color: #065f46; }
  .vt-status-rejected { background: #fee2e2; color: #991b1b; }
  .saisie-chip[aria-pressed="true"] { background: var(--color-brand); color: #fff; border-color: var(--color-brand); }
  /* Action buttons: one colour per action, a spinner while the server answers. */
  .saisie-btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem; min-height: 2.25rem;
                padding: 0.3rem 0.8rem; border-radius: 0.375rem; border: 1px solid transparent; font-size: 0.875rem;
                font-weight: 600; line-height: 1.2; transition: background-color .15s, box-shadow .15s, opacity .15s;
                touch-action: manipulation; }
  .saisie-btn[hidden] { display: none; }
  .saisie-btn:focus-visible { outline: 2px solid var(--color-brand-gold); outline-offset: 2px; }
  .saisie-btn-lg { min-height: 2.75rem; padding: 0.5rem 1rem; font-size: 0.95rem; box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
  .saisie-btn-save     { background: var(--color-brand, #9B1C1C); color: #fff; }
  .saisie-btn-save:hover:not(:disabled) { filter: brightness(1.12); }
  .saisie-btn-review   { background: #9B1C1C; color: #fff; }
  .saisie-btn-review:hover:not(:disabled) { background: #9B1C1C; }
  .saisie-btn-validate { background: #047857; color: #fff; }
  .saisie-btn-validate:hover:not(:disabled) { background: #065f46; }
  .saisie-btn-reject   { background: #fff; color: #b91c1c; border-color: #fca5a5; }
  .saisie-btn-reject:hover:not(:disabled) { background: #fef2f2; }
  .saisie-btn-delete   { background: #fff; color: #b91c1c; border-color: #fecaca; font-weight: 500; }
  .saisie-btn-delete:hover:not(:disabled) { background: #fef2f2; }
  .saisie-btn-neutral  { background: #fff; color: #544D45; border-color: #DDD0BD; font-weight: 500; }
  .saisie-btn-neutral:hover:not(:disabled) { background: #F6EFE4; }
  .saisie-btn:disabled { opacity: 0.55; cursor: not-allowed; }
  .saisie-btn[aria-busy="true"] { opacity: 0.9; cursor: progress; }
  .saisie-spinner { width: 1em; height: 1em; border-radius: 9999px; border: 2px solid currentColor; border-right-color: transparent;
                    animation: saisie-spin 0.7s linear infinite; flex: none; }
  @keyframes saisie-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .saisie-spinner { animation-duration: 2s; } }
  /* The row just changed: a short highlight. */
  .saisie-flash { animation: saisie-flash 1.6s ease-out; }
  @keyframes saisie-flash { from { background: #fef08a; } to { background: transparent; } }
  li.is-busy > :not(.saisie-actions) { opacity: 0.6; }
</style>
