{% extends "hakkadbapp/base.html" %}

{% block content %}
  {% for p in pronunciations %}
            <a href="{% url 'hanzi' p.simp %}">
              <span class="hanzi-block">
                <span class="simp">{{ p.simp }}</span>
                <span class="trad hidden">{{ p.trad }}</span>
              </span>
              <span class="text-sm">
                {% include "hakkadbapp/components/pinyin_switch.html" with i=p.initial.initial f=p.final.final t=p.tone.tone_number %}
              </span>
            </a>
  {% endfor %}
{% endblock %}
